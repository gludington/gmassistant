name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux
          - os: windows-latest
            platform: win
            args: --win
          - os: macos-15
            platform: mac-x64
            args: --mac --x64
          - os: macos-latest
            platform: mac-arm64
            args: --mac --arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: cd packages/backend && npx tsc

      - name: Build frontend (desktop mode)
        run: cd packages/frontend && npx vite build --mode desktop

      - name: Build desktop
        run: cd packages/desktop && npx tsc

      - name: Package
        run: cd packages/desktop && npx electron-builder ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Set release info
        id: info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=preview-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=Preview build #${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.name }}
          body: Test build — not for production use.
          files: artifacts/*
