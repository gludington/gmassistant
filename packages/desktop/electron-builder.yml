appId: com.gmassisstant.desktop
productName: GM Assistant
copyright: Copyright © 2026

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - "!dist/frontend/**/*"
  - node_modules/**/*

extraResources:
  - from: dist/frontend
    to: frontend
    filter:
      - "**/*"
  - from: ../../packages/backend/drizzle
    to: drizzle
    filter:
      - "*.sql"
      - "meta/**"

win:
  target:
    - target: nsis
      arch: [x64]

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  artifactName: gm-assistant_${version}_${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish: null
